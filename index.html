<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>143 Aim Club - Sensitivity Converter</title>
    <!-- НОВЫЙ ШРИФТ: Space Grotesk (технологичный, геймерский) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 12vh;
            overflow-x: hidden;
            
            background-color: #05020a;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .calculator-card {
            background: rgba(15, 10, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(96, 81, 155, 0.5);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(96, 81, 155, 0.3);
            position: relative;
            z-index: 1;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ (Языки + Соцсети) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            font-size: 12px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn.active {
            color: #fff;
            text-shadow: 0 0 10px #60519b, 0 0 20px #60519b;
        }

        .social-links {
            display: flex;
            gap: 12px;
        }

        .social-links a {
            color: #888;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-links a:hover {
            color: #fff;
            filter: drop-shadow(0 0 8px #60519b);
            transform: translateY(-2px);
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .logo-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #8a76df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 8px rgba(96, 81, 155, 0.6));
        }

        /* АНИМИРОВАННЫЙ ТУМБЛЕР РЕЖИМОВ */
        .tabs-container {
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(96, 81, 155, 0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            z-index: 1;
        }

        /* Это ползунок, который ездит под текстом */
        .tabs-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, rgba(96, 81, 155, 0.8), rgba(96, 81, 155, 0.2));
            border-radius: 8px;
            /* Плавная геймерская кривая анимации */
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
            color: #888;
        }

        .tab.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* ПОЛЯ ВВОДА */
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(96, 81, 155, 0.3);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        select:focus, input:focus {
            border-color: #8a76df;
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .swap-btn {
            background: rgba(96, 81, 155, 0.15);
            border: 1px solid rgba(96, 81, 155, 0.4);
            color: #fff;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(96, 81, 155, 0.8);
            font-family: 'Space Grotesk', sans-serif;
        }

        .swap-btn:hover {
            background: rgba(96, 81, 155, 0.4);
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.5);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px 15px;
            background: linear-gradient(180deg, rgba(96, 81, 155, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(96, 81, 155, 0.4);
            box-shadow: inset 0 0 20px rgba(96, 81, 155, 0.1);
        }

        .result-title {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px;
            text-shadow: 0 0 15px #60519b, 0 0 30px #60519b;
        }

        .cs2-options {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(96, 81, 155, 0.3);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
        }

        .checkbox-container input {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #60519b;
        }

        .zoom-results {
            margin-top: 10px;
            font-size: 14px;
            color: #d8cfff;
            display: none;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(96, 81, 155, 0.2);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="calculator-card">
    
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <!-- Переключатель языка -->
        <div class="lang-switch">
            <span class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</span>
            <span class="lang-btn" id="btn-ru" onclick="changeLang('ru')">RU</span>
        </div>

        <!-- Иконки соцсетей (ЗАМЕНИ ССЫЛКИ В href="#") -->
        <div class="social-links">
            <a href="#" target="_blank" title="YouTube">
                <svg viewBox="0 0 24 24">
                    <path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/>
                </svg>
            </a>
            <a href="#" target="_blank" title="Discord">
                <svg viewBox="0 0 24 24">
                    <path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.03.03.03.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.02.02.05.03.08.02c1.71-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12z"/>
                </svg>
            </a>
        </div>
    </div>

    <div class="logo-title">143 Aim Club</div>

    <!-- ТУМБЛЕР РЕЖИМОВ (Теперь с ползунком) -->
    <div class="tabs-container">
        <!-- Сам ползунок -->
        <div class="tabs-slider" id="tabs-slider"></div>
        
        <div class="tab active" onclick="switchMainTab('g2g')" id="tab-g2g">Game to Game</div>
        <div class="tab" onclick="switchMainTab('cm')" id="tab-cm" data-i18n="tab_cm">cm/360 ↔ Game</div>
    </div>

    <div id="mode-g2g">
        <div class="input-group">
            <label data-i18n="from_game">From Game:</label>
            <select id="g2g-game1" onchange="calculate()"></select>
        </div>
        <div class="input-group">
            <label data-i18n="sens_label">Sensitivity:</label>
            <input type="number" id="g2g-sens" step="any" placeholder="e.g. 1.5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label data-i18n="to_game">To Game:</label>
            <select id="g2g-game2" onchange="calculate()"></select>
        </div>
    </div>

    <div id="mode-cm" class="hidden">
        <button class="swap-btn" onclick="toggleCmMode()" data-i18n="swap_btn">🔁 Swap Direction</button>
        
        <div class="input-group">
            <label data-i18n="mouse_dpi">Mouse DPI:</label>
            <input type="number" id="cm-dpi" step="any" placeholder="e.g. 800" value="800" oninput="calculate()">
        </div>

        <div id="cm-submode-cm2game">
            <div class="input-group">
                <label data-i18n="target_cm">Target cm/360:</label>
                <input type="number" id="cm-input-cm" step="any" placeholder="e.g. 35" oninput="calculate()">
            </div>
            <div class="input-group">
                <label data-i18n="game_label">Game:</label>
                <select id="cm-game1" onchange="calculate()"></select>
            </div>
        </div>

        <div id="cm-submode-game2cm" class="hidden">
            <div class="input-group">
                <label data-i18n="game_label_2">Game:</label>
                <select id="cm-game2" onchange="calculate()"></select>
            </div>
            <div class="input-group">
                <label data-i18n="ingame_sens">In-game Sensitivity:</label>
                <input type="number" id="cm-input-sens" step="any" placeholder="e.g. 1.5" oninput="calculate()">
            </div>
        </div>
    </div>

    <div class="result-box">
        <div class="result-title" id="result-label" data-i18n="result_default">RESULT:</div>
        <div class="result-value" id="result-value">0.00</div>
    </div>

    <div class="cs2-options" id="cs2-box">
        <label class="checkbox-container">
            <input type="checkbox" id="cs2-zoom-check" onchange="calculate()"> 
            <span data-i18n="cs2_zoom">Include Zoom (AWP/Scout)</span>
        </label>
        <div class="zoom-results" id="cs2-zoom-results">
            <span data-i18n="zoom1">1st Zoom:</span> <span id="cs2-z1">0</span> cm/360<br>
            <span data-i18n="zoom2">2nd Zoom:</span> <span id="cs2-z2">0</span> cm/360
        </div>
    </div>

</div>

<script>
    // === АНИМАЦИЯ ЧАСТИЦ ===
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles =
