<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>143 aim club - Sensitivity Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* БАЗОВЫЙ ФОН */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff;
            
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            box-sizing: border-box;
            
            display: flex;
            justify-content: center;
            align-items: center; 
            
            background-color: #05020a;
            background-image: url('space-bg.jpg');
            background-size: 105%;
            background-position: center;
            background-repeat: no-repeat;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* КАРТОЧКА КАЛЬКУЛЯТОРА */
        .calculator-card {
            background: rgba(15, 10, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(137, 102, 245, 0.5);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(137, 102, 245, 0.3);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ С ИКОНКАМИ */
        .top-bar {
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            gap: 12px;
        }

        .social-links a {
            color: #888;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-links a:hover {
            color: #fff;
            filter: drop-shadow(0 0 8px #A985FF);
            transform: translateY(-2px);
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ЛОГОТИП */
        .logo-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #A985FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(169, 133, 255, 0.6));
        }

        /* --- ГЛАВНЫЙ ТУМБЛЕР --- */
        .tabs-container {
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(137, 102, 245, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 1;
            box-sizing: border-box;
        }

        .tabs-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(180deg, rgba(169, 133, 255, 0.6), rgba(137, 102, 245, 0.15));
            border-radius: 8px;
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
            box-shadow: 0 0 12px rgba(169, 133, 255, 0.4);
            border: 1px solid rgba(169, 133, 255, 0.4);
            box-sizing: border-box;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.3s ease;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .modes-wrapper {
            position: relative;
            box-sizing: border-box;
        }

        /* ПОЛЯ ВВОДА */
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(137, 102, 245, 0.3);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #A985FF;
            box-shadow: 0 0 15px rgba(169, 133, 255, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- МИНИ-ТУМБЛЕР --- */
        .mini-tabs {
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 8px;
            border: 1px solid rgba(137, 102, 245, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 1;
            box-sizing: border-box;
        }

        .mini-slider {
            position: absolute;
            top: 3px;
            bottom: 3px;
            left: 3px;
            width: calc(50% - 3px);
            background: linear-gradient(180deg, rgba(169, 133, 255, 0.5), rgba(137, 102, 245, 0.15));
            border-radius: 6px;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
            box-shadow: 0 0 10px rgba(169, 133, 255, 0.4);
            border: 1px solid rgba(169, 133, 255, 0.3);
            box-sizing: border-box;
        }

        .mini-tab {
            flex: 1;
            text-align: center;
            padding: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: #888;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mini-tab.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* COMBOBOX */
        .combobox {
            position: relative;
            width: 100%;
        }

        .combobox::after {
            content: '▼';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #888;
            pointer-events: none;
            transition: color 0.3s;
        }

        .combobox:hover::after {
            color: #A985FF;
        }

        .combobox-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(15, 10, 25, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(137, 102, 245, 0.4);
            border-radius: 8px;
            margin-top: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .combobox-list.active {
            display: block;
        }

        .combobox-option {
            padding: 12px 15px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .combobox-option:last-child {
            border-bottom: none;
        }

        .combobox-option:hover {
            background: rgba(137, 102, 245, 0.4);
            color: #fff;
            padding-left: 20px;
        }

        .combobox-list::-webkit-scrollbar { width: 6px; }
        .combobox-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 8px;}
        .combobox-list::-webkit-scrollbar-thumb { background: rgba(137, 102, 245, 0.6); border-radius: 8px; }
        .combobox-list::-webkit-scrollbar-thumb:hover { background: rgba(169, 133, 255, 0.8); }

        /* THE FINALS OPTIONS BLOCK */
        .tf-options {
            display: none;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(137, 102, 245, 0.3);
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .tf-advanced-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(137, 102, 245, 0.2);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tf-opt-row {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tf-opt-row:last-child {
            margin-bottom: 0;
        }
        .tf-opt-row label {
            font-size: 11px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tf-opt-row input[type="text"] {
            width: 70px;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            margin: 0;
        }
        .tf-opt-row input[type="range"] {
            width: 100%;
            margin-top: 8px;
            accent-color: #A985FF;
            cursor: pointer;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            color: #ccc;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .checkbox-container:hover {
            color: #fff;
        }

        .checkbox-container input {
            cursor: pointer;
            accent-color: #A985FF;
            width: 16px;
            height: 16px;
            margin: 0;
            margin-right: 10px;
        }

        /* РЕЗУЛЬТАТ */
        .result-box {
            margin-top: 20px;
            padding: 20px 15px;
            background: linear-gradient(180deg, rgba(137, 102, 245, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(137, 102, 245, 0.4);
            box-shadow: inset 0 0 20px rgba(137, 102, 245, 0.1);
            position: relative;
        }

        .result-title {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px;
            text-shadow: 0 0 15px #8966f5, 0 0 30px #A985FF;
        }

        .config-value {
            font-size: 12px;
            color: #A985FF;
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: none;
        }

        /* СТОЛБИКИ ПРИЦЕЛОВ (THE FINALS) */
        .tf-ads-results {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(137, 102, 245, 0.2);
            animation: fadeIn 0.3s ease;
        }
        .tf-ads-cat-title {
            font-size: 10px;
            color: #A985FF;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: -4px;
        }
        .tf-ads-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .tf-ads-col {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(137, 102, 245, 0.2);
            border-radius: 8px;
            padding: 8px 5px;
            text-align: center;
        }
        .tf-ads-title {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .tf-ads-val {
            font-size: 14px;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 5px #A985FF;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="calculator-card">
    
    <div class="top-bar">
        <div class="social-links">
            <a href="https://www.youtube.com/@143aimclub" target="_blank" title="YouTube">
                <svg viewBox="0 0 24 24"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
            </a>
            <a href="https://discord.gg/143aimclub" target="_blank" title="Discord">
                <svg viewBox="0 0 24 24"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.03.03.03.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.02.02.05.03.08.02c1.71-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12z"/></svg>
            </a>
        </div>
    </div>

    <div class="logo-title">143 AIM CLUB</div>

    <!-- Главный тумблер -->
    <div class="tabs-container">
        <div class="tabs-slider" id="tabs-slider"></div>
        <div class="tab active" onclick="switchMainTab('cm')" id="tab-cm">CM/360 TO GAME</div>
        <div class="tab" onclick="switchMainTab('g2g')" id="tab-g2g">GAME TO GAME</div>
    </div>

    <div class="modes-wrapper">
        
        <!-- РЕЖИМ 1: CM/360 to GAME -->
        <div id="mode-cm">
            <div class="input-group">
                <label>GAME:</label>
                <div class="combobox">
                    <input type="text" id="cm-game" autocomplete="off" spellcheck="false" placeholder="Search game...">
                    <div class="combobox-list" id="cm-game-list"></div>
                </div>
            </div>

            <div class="input-group">
                <label>MOUSE DPI:</label>
                <input type="text" inputmode="decimal" id="cm-dpi" placeholder="e.g. 800" value="800" oninput="calculate()">
            </div>

            <div class="input-group">
                <!-- Тонкий мини-тумблер -->
                <div class="mini-tabs">
                    <div class="mini-slider" id="mini-slider"></div>
                    <div class="mini-tab active" id="mtab-cm2game" onclick="setSubMode(true)">CM TO GAME</div>
                    <div class="mini-tab" id="mtab-game2cm" onclick="setSubMode(false)">GAME TO CM</div>
                </div>
                <input type="text" inputmode="decimal" id="cm-dynamic-input" placeholder="e.g. 35" oninput="calculate()">
            </div>
        </div>

        <!-- РЕЖИМ 2: GAME TO GAME -->
        <div id="mode-g2g" class="hidden">
            <div class="input-group">
                <label>FROM GAME:</label>
                <div class="combobox">
                    <input type="text" id="g2g-game1" autocomplete="off" spellcheck="false" placeholder="Search game...">
                    <div class="combobox-list" id="g2g-game1-list"></div>
                </div>
            </div>
            <div class="input-group">
                <label>SENSITIVITY:</label>
                <input type="text" inputmode="decimal" id="g2g-sens" placeholder="e.g. 1.5" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>TO GAME:</label>
                <div class="combobox">
                    <input type="text" id="g2g-game2" autocomplete="off" spellcheck="false" placeholder="Search game...">
                    <div class="combobox-list" id="g2g-game2-list"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ ДЛЯ THE FINALS (Спрятано под галочку) -->
    <div class="tf-options" id="tf-box">
        <label class="checkbox-container" style="justify-content: center;">
            <input type="checkbox" id="tf-advanced-check" onchange="calculate()">
            <span>SHOW ADVANCED (FOV, ADS)</span>
        </label>

        <div class="tf-advanced-content" id="tf-advanced-content">
            <div class="tf-opt-row">
                <label class="checkbox-container" style="width:100%; display:flex; justify-content: space-between; align-items:center; margin:0;">
                    <span>FOCAL LENGTH SENSITIVITY SCALING</span>
                    <input type="checkbox" id="tf-fls" checked onchange="calculate()" style="margin-right:0;">
                </label>
            </div>
            
            <div class="tf-opt-row" style="flex-direction: column; align-items: flex-start; margin-bottom:0; margin-top: 15px;">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
                    <label style="margin:0;">HIPFIRE FOV:</label>
                    <span id="tf-fov-val" style="color:#fff; font-size:12px; font-weight:700;">71</span>
                </div>
                <input type="range" id="tf-fov" min="45" max="100" value="71" oninput="document.getElementById('tf-fov-val').innerText = this.value; calculate()">
            </div>

            <div class="tf-opt-row" style="flex-direction: column; align-items: flex-start; margin-bottom:0; margin-top: 10px;">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
                    <label style="margin:0;">MOUSE ZOOM SENS. MULTIPLIER:</label>
                    <span id="tf-zoom-val" style="color:#fff; font-size:12px; font-weight:700;">100%</span>
                </div>
                <input type="range" id="tf-zoom-slider" min="1" max="200" value="100" oninput="document.getElementById('tf-zoom-val').innerText = this.value + '%'; calculate()">
            </div>
            
            <div class="tf-opt-row" style="flex-direction: column; align-items: flex-start; margin-bottom:0; margin-top: 10px;">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
                    <label style="margin:0;">SCOPED ZOOM SENS. MULTIPLIER:</label>
                    <span id="tf-scoped-zoom-val" style="color:#fff; font-size:12px; font-weight:700;">100%</span>
                </div>
                <input type="range" id="tf-scoped-zoom-slider" min="1" max="200" value="100" oninput="document.getElementById('tf-scoped-zoom-val').innerText = this.value + '%'; calculate()">
            </div>
        </div>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="result-box">
        <div class="result-title" id="result-label">RESULT:</div>
        <div class="result-value" id="result-value">0.00</div>
        
        <!-- Конфиг-значение для The Finals -->
        <div class="config-value" id="config-result"></div>

        <!-- Столбики прицелов для The Finals (тоже прячутся под галочку) -->
        <div class="tf-ads-results" id="tf-ads-results">
            <div class="tf-ads-cat-title">MOUSE ZOOM SENSITIVITY</div>
            <div class="tf-ads-row">
                <div class="tf-ads-col">
                    <div class="tf-ads-title">IRON/RED DOT</div>
                    <div class="tf-ads-val" id="tf-iron-res">0 cm</div>
                </div>
                <div class="tf-ads-col">
                    <div class="tf-ads-title">MAGNIFEX</div>
                    <div class="tf-ads-val" id="tf-med-res">0 cm</div>
                </div>
            </div>
            <div class="tf-ads-cat-title" style="margin-top: 5px;">SCOPED ZOOM SENSITIVITY</div>
            <div class="tf-ads-row">
                <div class="tf-ads-col">
                    <div class="tf-ads-title">SR-84 (SNIPER)</div>
                    <div class="tf-ads-val" id="tf-sniper-res">0 cm</div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // === АНИМАЦИЯ (МУЛЬТИ-ПАРАЛЛАКС) ===
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles =[];
    
    let mouseX = 0;
    let mouseY = 0;
    let targetMouseX = 0;
    let targetMouseY = 0;

    window.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX - window.innerWidth / 2) * 0.05;
        targetMouseY = (e.clientY - window.innerHeight / 2) * 0.05;
    });

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * (canvas.width + 200) - 100;
            this.y = Math.random() * (canvas.height + 200) - 100;
            this.z = Math.random() * 2 + 0.5; 
            this.speedY = this.z * 0.2 + 0.1; 
            this.speedX = (Math.random() - 0.5) * 0.2;
            this.alpha = Math.random() * 0.6 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.y > canvas.height + 100) {
                this.y = -100;
                this.x = Math.random() * (canvas.width + 200) - 100;
            }
            if (this.x < -100) this.x = canvas.width + 100;
            if (this.x > canvas.width + 100) this.x = -100;
        }
        draw() {
            let drawX = this.x - mouseX * this.z;
            let drawY = this.y - mouseY * this.z;

            ctx.beginPath();
            ctx.arc(drawX, drawY, this.z * 0.8, 0, Math.PI * 2); 
            ctx.fillStyle = `rgba(215, 210, 255, ${this.alpha})`;
            ctx.shadowBlur = this.z * 3;
            ctx.shadowColor = `rgba(215, 210, 255, ${this.alpha})`;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    for (let i = 0; i < 80; i++) {
        particles.push(new Particle());
    }

    function animateParticles() {
        mouseX += (targetMouseX - mouseX) * 0.1;
        mouseY += (targetMouseY - mouseY) * 0.1;

        document.body.style.backgroundPosition = `calc(50% + ${-mouseX}px) calc(50% + ${-mouseY}px)`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(5, 2, 10, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // === БАЗА ИГР С ОКРУГЛЕНИЕМ, СУФФИКСАМИ И АЛИАСАМИ ===
    const games = {
        "cs2": { 
            name: "CS2 / Apex Legends / Source", 
            aliases:["counter", "strike", "cs", "csgo", "apex", "source"], 
            yaw: 0.022, 
            decimals: 2 
        },
        "val": { 
            name: "Valorant", 
            aliases:["val", "valorant"], 
            yaw: 0.07, 
            decimals: 3 
        },
        "ow2": { 
            name: "Overwatch / Call of Duty", 
            aliases:["ow", "ow2", "overwatch", "cod", "call", "warzone", "mw"], 
            yaw: 0.0066, 
            decimals: 2 
        },
        "mr": { 
            name: "Marvel Rivals", 
            aliases:["marvel", "rivals", "mr"], 
            yaw: 0.0175, 
            decimals: 2 
        },
        "tf": { 
            name: "The Finals", 
            aliases:["finals", "the finals", "tf"], 
            yaw: 0.002, /* Исправлено с 0.001 на правильные 0.002 на основе математики */
            decimals: 0 
        },
        "fn": { 
            name: "Fortnite", 
            aliases:["fortnite", "fn", "fort"], 
            yaw: 0.0055, 
            decimals: 1, 
            suffix: "%"  
        }
    };

    let currentMainTab = 'cm'; 
    let isCmToGame = true; 

    window.onload = () => {
        initComboboxes();
        switchMainTab('cm'); 
    };

    function parseInputVal(id) {
        let val = document.getElementById(id).value;
        if (!val) return NaN;
        val = val.replace(',', '.'); 
        return parseFloat(val);
    }

    function initComboboxes() {
        const cBoxes =['g2g-game1', 'g2g-game2', 'cm-game'];
        cBoxes.forEach(id => {
            const input = document.getElementById(id);
            if (!input.dataset.key) input.dataset.key = 'cs2';
            if (id === 'g2g-game2') input.dataset.key = 'val'; 
            
            input.value = games[input.dataset.key].name;
            setupCombobox(id);
        });
    }

    function setupCombobox(inputId) {
        const input = document.getElementById(inputId);
        const list = document.getElementById(inputId + '-list');

        function renderList(filter = '') {
            list.innerHTML = '';
            const f = filter.toLowerCase();
            for (let key in games) {
                const game = games[key];
                
                const matchName = game.name.toLowerCase().includes(f);
                const matchAlias = game.aliases && game.aliases.some(alias => alias.includes(f));
                
                if (matchName || matchAlias) {
                    const opt = document.createElement('div');
                    opt.className = 'combobox-option';
                    opt.innerText = game.name;
                    opt.onclick = () => {
                        input.value = game.name;
                        input.dataset.key = key;
                        list.classList.remove('active');
                        calculate();
                    };
                    list.appendChild(opt);
                }
            }
            if (list.innerHTML === '') {
                list.innerHTML = '<div class="combobox-option" style="color:#777">Not found</div>';
            }
        }

        input.addEventListener('focus', () => {
            input.select();
            renderList();
            list.classList.add('active');
        });

        input.addEventListener('input', () => {
            renderList(input.value);
            list.classList.add('active');
            
            let matchedKey = null;
            for (let key in games) {
                if (games[key].name.toLowerCase() === input.value.toLowerCase()) {
                    matchedKey = key;
                    break;
                }
            }
            if (matchedKey) {
                input.dataset.key = matchedKey;
            } else {
                input.dataset.key = ''; 
            }
            calculate();
        });

        document.addEventListener('click', (e) => {
            if (e.target !== input && !list.contains(e.target)) {
                list.classList.remove('active');
                if (input.dataset.key && games[input.dataset.key]) {
                    input.value = games[input.dataset.key].name;
                } else {
                    input.dataset.key = 'cs2';
                    input.value = games['cs2'].name;
                    calculate();
                }
            }
        });
    }

    function switchMainTab(tab) {
        currentMainTab = tab;
        
        const slider = document.getElementById('tabs-slider');
        if (tab === 'cm') {
            slider.style.left = '4px';
        } else {
            slider.style.left = '50%';
        }

        document.getElementById('tab-cm').classList.toggle('active', tab === 'cm');
        document.getElementById('tab-g2g').classList.toggle('active', tab === 'g2g');
        
        document.getElementById('mode-cm').classList.toggle('hidden', tab !== 'cm');
        document.getElementById('mode-g2g').classList.toggle('hidden', tab !== 'g2g');
        calculate();
    }

    function setSubMode(isCm) {
        isCmToGame = isCm;
        
        const slider = document.getElementById('mini-slider');
        slider.style.left = isCm ? '3px' : '50%';
        
        document.getElementById('mtab-cm2game').classList.toggle('active', isCm);
        document.getElementById('mtab-game2cm').classList.toggle('active', !isCm);
        
        const dynInput = document.getElementById('cm-dynamic-input');
        dynInput.placeholder = isCm ? 'e.g. 35' : 'e.g. 1.5';
        
        dynInput.value = '';
        calculate();
    }

    // === ГЛАВНЫЙ РАСЧЕТ И МАТЕМАТИКА ===
    function calculate() {
        let resultText = "0.00";
        let resultLabel = "RESULT:";
        let configText = ""; 
        let baseCm360 = 0;
        let showTfBox = false;

        let g1 = document.getElementById('g2g-game1').dataset.key;
        let g2 = document.getElementById('g2g-game2').dataset.key;
        let g_cm = document.getElementById('cm-game').dataset.key;

        // ЛОГИКА: Показываем настройки The Finals ТОЛЬКО когда мы переводим В неё или считаем её CM
        if (currentMainTab === 'g2g') {
            if (g2 === 'tf') showTfBox = true; // Только когда цель = TF
            let sens = parseInputVal('g2g-sens'); 

            if (g1 && g2 && !isNaN(sens) && sens > 0) {
                let dpi = parseInputVal('cm-dpi') || 800; 
                baseCm360 = (360 * 2.54) / (sens * dpi * games[g1].yaw);

                let converted = (sens * games[g1].yaw) / games[g2].yaw;
                let targetGame = games[g2];
                
                if (g2 === 'tf') {
                    resultText = Math.round(converted).toString(); 
                    configText = `FOR CONFIG FILE: ${(converted / 100).toFixed(6)}`; 
                } else {
                    let dec = targetGame.decimals !== undefined ? targetGame.decimals : 4; 
                    resultText = converted.toFixed(dec); 
                    if (targetGame.suffix) resultText += targetGame.suffix;
                }
                
                resultLabel = `SENSITIVITY FOR ${targetGame.name}:`;
            }

        } else if (currentMainTab === 'cm') {
            if (g_cm === 'tf') showTfBox = true;
            let dpi = parseInputVal('cm-dpi');
            let val = parseInputVal('cm-dynamic-input');
            let g = document.getElementById('cm-game').dataset.key;
            
            if (g && !isNaN(dpi) && !isNaN(val) && val > 0 && dpi > 0) {
                let targetGame = games[g];

                if (isCmToGame) {
                    baseCm360 = val;
                    let converted = (360 * 2.54) / (val * dpi * targetGame.yaw);
                    
                    if (g === 'tf') {
                        resultText = Math.round(converted).toString();
                        configText = `FOR CONFIG FILE: ${(converted / 100).toFixed(6)}`;
                    } else {
                        let dec = targetGame.decimals !== undefined ? targetGame.decimals : 4; 
                        resultText = converted.toFixed(dec);
                        if (targetGame.suffix) resultText += targetGame.suffix;
                    }
                    resultLabel = `SENSITIVITY FOR ${targetGame.name}:`;
                } else {
                    let cm = (360 * 2.54) / (val * dpi * targetGame.yaw);
                    baseCm360 = cm;
                    resultText = cm.toFixed(2) + " cm/360"; 
                    resultLabel = "DISTANCE ON MOUSEPAD:";
                }
            }
        }

        // ОБНОВЛЯЕМ ТЕКСТ РЕЗУЛЬТАТОВ
        document.getElementById('result-value').innerText = resultText;
        document.getElementById('result-label').innerText = resultLabel;

        let configDiv = document.getElementById('config-result');
        if (configText !== "") {
            configDiv.innerText = configText;
            configDiv.style.display = 'block';
        } else {
            configDiv.style.display = 'none';
        }

        // УПРАВЛЕНИЕ БЛОКОМ THE FINALS
        const tfBox = document.getElementById('tf-box');
        const tfAdvContent = document.getElementById('tf-advanced-content');
        const tfAdsResults = document.getElementById('tf-ads-results');
        const isAdvChecked = document.getElementById('tf-advanced-check').checked;
        
        if (showTfBox) {
            tfBox.style.display = 'block';
            
            // Если включена галочка SHOW ADVANCED
            if (isAdvChecked) {
                tfAdvContent.style.display = 'block';
                
                if (baseCm360 > 0) {
                    tfAdsResults.style.display = 'flex';
                    let fov = parseFloat(document.getElementById('tf-fov').value) || 71;
                    let fls_on = document.getElementById('tf-fls').checked;
                    let mouse_zoom = parseFloat(document.getElementById('tf-zoom-slider').value) / 100;
                    let scoped_zoom = parseFloat(document.getElementById('tf-scoped-zoom-slider').value) / 100;
                    
                    let getAdsCm = (base, fovMult, isSniper, zoomMult) => {
                        if (!fls_on) {
                            return base / zoomMult;
                        } else {
                            let hip_rad = (fov / 2) * (Math.PI / 180);
                            let ads_rad = isSniper ? (25 / 2) * (Math.PI / 180) : ((fov * fovMult) / 2) * (Math.PI / 180);
                            let ratio = Math.tan(ads_rad) / Math.tan(hip_rad);
                            return base / (ratio * zoomMult);
                        }
                    };

                    document.getElementById('tf-iron-res').innerText = getAdsCm(baseCm360, 0.78, false, mouse_zoom).toFixed(1) + ' cm';
                    document.getElementById('tf-med-res').innerText = getAdsCm(baseCm360, 0.68, false, mouse_zoom).toFixed(1) + ' cm';
                    document.getElementById('tf-sniper-res').innerText = getAdsCm(baseCm360, null, true, scoped_zoom).toFixed(1) + ' cm';
                } else {
                    tfAdsResults.style.display = 'none';
                }
            } else {
                tfAdvContent.style.display = 'none';
                tfAdsResults.style.display = 'none';
            }
        } else {
            tfBox.style.display = 'none';
            tfAdvContent.style.display = 'none';
            tfAdsResults.style.display = 'none';
            document.getElementById('tf-advanced-check').checked = false; // Сбрасываем галочку при уходе
        }
    }
</script>
