<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>143 aim club - Sensitivity Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff;
            
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            box-sizing: border-box;
            
            display: flex;
            justify-content: center;
            align-items: center; 
            
            background-color: #05020a;
            background-image: url('space-bg.jpg');
            background-size: 105%;
            background-position: center;
            background-repeat: no-repeat;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .calculator-card {
            background: rgba(15, 10, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(96, 81, 155, 0.5);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(96, 81, 155, 0.3);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            font-size: 12px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn.active {
            color: #fff;
            text-shadow: 0 0 10px #60519b, 0 0 20px #60519b;
        }

        .social-links {
            display: flex;
            gap: 12px;
        }

        .social-links a {
            color: #888;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-links a:hover {
            color: #fff;
            filter: drop-shadow(0 0 8px #60519b);
            transform: translateY(-2px);
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .logo-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #8a76df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: lowercase;
            filter: drop-shadow(0 0 10px rgba(96, 81, 155, 0.6));
        }

        /* --- ГЛАВНЫЙ ТУМБЛЕР --- */
        .tabs-container {
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(96, 81, 155, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 1;
            box-sizing: border-box;
        }

        .tabs-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(180deg, rgba(138, 118, 223, 0.6), rgba(96, 81, 155, 0.15));
            border-radius: 8px;
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
            box-shadow: 0 0 12px rgba(138, 118, 223, 0.4);
            border: 1px solid rgba(138, 118, 223, 0.4);
            box-sizing: border-box;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
            color: #888;
        }

        .tab.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .modes-wrapper {
            min-height: 250px;
            position: relative;
            box-sizing: border-box;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(96, 81, 155, 0.3);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #8a76df;
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- МИНИ-ТУМБЛЕР --- */
        .mini-tabs {
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 8px;
            border: 1px solid rgba(96, 81, 155, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 1;
            box-sizing: border-box;
        }

        .mini-slider {
            position: absolute;
            top: 3px;
            bottom: 3px;
            left: 3px;
            width: calc(50% - 3px);
            background: linear-gradient(180deg, rgba(138, 118, 223, 0.5), rgba(96, 81, 155, 0.15));
            border-radius: 6px;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
            box-shadow: 0 0 10px rgba(138, 118, 223, 0.4);
            border: 1px solid rgba(138, 118, 223, 0.3);
            box-sizing: border-box;
        }

        .mini-tab {
            flex: 1;
            text-align: center;
            padding: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: #888;
            transition: color 0.3s;
        }

        .mini-tab.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* COMBOBOX */
        .combobox {
            position: relative;
            width: 100%;
        }

        .combobox::after {
            content: '▼';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #888;
            pointer-events: none;
            transition: color 0.3s;
        }

        .combobox:hover::after {
            color: #a985ff;
        }

        .combobox-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(15, 10, 25, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(96, 81, 155, 0.4);
            border-radius: 8px;
            margin-top: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .combobox-list.active {
            display: block;
        }

        .combobox-option {
            padding: 12px 15px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .combobox-option:last-child {
            border-bottom: none;
        }

        .combobox-option:hover {
            background: rgba(96, 81, 155, 0.4);
            color: #fff;
            padding-left: 20px;
        }

        .combobox-list::-webkit-scrollbar { width: 6px; }
        .combobox-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 8px;}
        .combobox-list::-webkit-scrollbar-thumb { background: rgba(96, 81, 155, 0.6); border-radius: 8px; }
        .combobox-list::-webkit-scrollbar-thumb:hover { background: rgba(96, 81, 155, 0.8); }

        .result-box {
            margin-top: 20px;
            padding: 20px 15px;
            background: linear-gradient(180deg, rgba(96, 81, 155, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(96, 81, 155, 0.4);
            box-shadow: inset 0 0 20px rgba(96, 81, 155, 0.1);
        }

        .result-title {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px;
            text-shadow: 0 0 15px #60519b, 0 0 30px #60519b;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="calculator-card">
    
    <div class="top-bar">
        <div class="lang-switch">
            <span class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</span>
            <span class="lang-btn" id="btn-ru" onclick="changeLang('ru')">RU</span>
        </div>
        <div class="social-links">
            <a href="#" target="_blank" title="YouTube">
                <svg viewBox="0 0 24 24"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
            </a>
            <a href="#" target="_blank" title="Discord">
                <svg viewBox="0 0 24 24"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.03.03.03.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.02.02.05.03.08.02c1.71-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12z"/></svg>
            </a>
        </div>
    </div>

    <!-- Логотип с новым шрифтом -->
    <div class="logo-title">143 aim club</div>

    <!-- Главный тумблер -->
    <div class="tabs-container">
        <div class="tabs-slider" id="tabs-slider"></div>
        <div class="tab active" onclick="switchMainTab('cm')" id="tab-cm">cm/360 to game</div>
        <div class="tab" onclick="switchMainTab('g2g')" id="tab-g2g">game to game</div>
    </div>

    <div class="modes-wrapper">
        
        <!-- РЕЖИМ 1: CM/360 to GAME -->
        <div id="mode-cm">
            <div class="input-group">
                <label data-i18n="game_label">Game:</label>
                <div class="combobox">
                    <input type="text" id="cm-game" autocomplete="off" spellcheck="false" placeholder="Search game...">
                    <div class="combobox-list" id="cm-game-list"></div>
                </div>
            </div>

            <div class="input-group">
                <label data-i18n="mouse_dpi">Mouse DPI:</label>
                <input type="text" inputmode="decimal" id="cm-dpi" placeholder="e.g. 800" value="800" oninput="calculate()">
            </div>

            <div class="input-group">
                <!-- Тонкий мини-тумблер -->
                <div class="mini-tabs">
                    <div class="mini-slider" id="mini-slider"></div>
                    <div class="mini-tab active" id="mtab-cm2game" onclick="setSubMode(true)">cm to game</div>
                    <div class="mini-tab" id="mtab-game2cm" onclick="setSubMode(false)">game to cm</div>
                </div>
                <input type="text" inputmode="decimal" id="cm-dynamic-input" placeholder="e.g. 35" oninput="calculate()">
            </div>
        </div>

        <!-- РЕЖИМ 2: GAME TO GAME -->
        <div id="mode-g2g" class="hidden">
            <div class="input-group">
                <label data-i18n="from_game">From Game:</label>
                <div class="combobox">
                    <input type="text" id="g2g-game1" autocomplete="off" spellcheck="false" placeholder="Search game...">
                    <div class="combobox-list" id="g2g-game1-list"></div>
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="sens_label">Sensitivity:</label>
                <input type="text" inputmode="decimal" id="g2g-sens" placeholder="e.g. 1.5" oninput="calculate()">
            </div>
            <div class="input-group">
                <label data-i18n="to_game">To Game:</label>
                <div class="combobox">
                    <input type="text" id="g2g-game2" autocomplete="off" spellcheck="false" placeholder="Search game...">
                    <div class="combobox-list" id="g2g-game2-list"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="result-box">
        <div class="result-title" id="result-label" data-i18n="result_default">RESULT:</div>
        <div class="result-value" id="result-value">0.00</div>
    </div>

</div>

<script>
    // === АНИМАЦИЯ (МУЛЬТИ-ПАРАЛЛАКС) ===
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles =[];
    
    let mouseX = 0;
    let mouseY = 0;
    let targetMouseX = 0;
    let targetMouseY = 0;

    window.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX - window.innerWidth / 2) * 0.05;
        targetMouseY = (e.clientY - window.innerHeight / 2) * 0.05;
    });

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * (canvas.width + 200) - 100;
            this.y = Math.random() * (canvas.height + 200) - 100;
            this.z = Math.random() * 2 + 0.5; 
            this.speedY = this.z * 0.2 + 0.1; 
            this.speedX = (Math.random() - 0.5) * 0.2;
            this.alpha = Math.random() * 0.6 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.y > canvas.height + 100) {
                this.y = -100;
                this.x = Math.random() * (canvas.width + 200) - 100;
            }
            if (this.x < -100) this.x = canvas.width + 100;
            if (this.x > canvas.width + 100) this.x = -100;
        }
        draw() {
            let drawX = this.x - mouseX * this.z;
            let drawY = this.y - mouseY * this.z;

            ctx.beginPath();
            ctx.arc(drawX, drawY, this.z * 0.8, 0, Math.PI * 2); 
            ctx.fillStyle = `rgba(210, 205, 240, ${this.alpha})`;
            ctx.shadowBlur = this.z * 3;
            ctx.shadowColor = `rgba(210, 205, 240, ${this.alpha})`;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    for (let i = 0; i < 80; i++) {
        particles.push(new Particle());
    }

    function animateParticles() {
        mouseX += (targetMouseX - mouseX) * 0.1;
        mouseY += (targetMouseY - mouseY) * 0.1;

        document.body.style.backgroundPosition = `calc(50% + ${-mouseX}px) calc(50% + ${-mouseY}px)`;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(5, 2, 10, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // === БАЗА ИГР С ОКРУГЛЕНИЕМ И АЛИАСАМИ ===
    const games = {
        "cs2": { 
            name: "CS2 / Apex Legends / Source", 
            aliases: ["counter", "strike", "cs", "csgo", "apex", "source"], 
            yaw: 0.022, 
            decimals: 2 
        },
        "val": { 
            name: "Valorant", 
            aliases: ["val", "valorant"], 
            yaw: 0.07, 
            decimals: 3 
        },
        "ow2": { 
            name: "Overwatch / Call of Duty", 
            aliases:["ow", "ow2", "overwatch", "cod", "call", "warzone", "mw"], 
            yaw: 0.0066, 
            decimals: 2 
        },
        "mr": { 
            name: "Marvel Rivals", 
            aliases: ["marvel", "rivals", "mr"], 
            yaw: 0.0175, 
            decimals: 2 
        },
        "tf": { 
            name: "The Finals", 
            aliases: ["finals", "the finals", "tf"], 
            yaw: 0.001, 
            decimals: 3 
        }
    };

    let currentMainTab = 'cm'; 
    let isCmToGame = true; 
    let currentLang = 'en';

    const i18n = {
        en: {
            from_game: "From Game:",
            sens_label: "Sensitivity:",
            to_game: "To Game:",
            mouse_dpi: "Mouse DPI:",
            game_label: "Game:",
            result_default: "RESULT:",
            sens_for: "Sensitivity for",
            cm_dist: "Distance on mousepad:",
            placeholder_sens: "e.g. 1.5",
            placeholder_dpi: "e.g. 800",
            placeholder_cm: "e.g. 35"
        },
        ru: {
            from_game: "Из игры:",
            sens_label: "Чувствительность:",
            to_game: "В игру:",
            mouse_dpi: "DPI мыши:",
            game_label: "Игра:",
            result_default: "РЕЗУЛЬТАТ:",
            sens_for: "Сенса для",
            cm_dist: "Дистанция на коврике:",
            placeholder_sens: "Например: 1.5",
            placeholder_dpi: "Например: 800",
            placeholder_cm: "Например: 35"
        }
    };

    window.onload = () => {
        initComboboxes();
        changeLang('en'); 
        switchMainTab('cm'); 
    };

    function parseInputVal(id) {
        let val = document.getElementById(id).value;
        if (!val) return NaN;
        val = val.replace(',', '.'); 
        return parseFloat(val);
    }

    function initComboboxes() {
        const cBoxes =['g2g-game1', 'g2g-game2', 'cm-game'];
        cBoxes.forEach(id => {
            const input = document.getElementById(id);
            if (!input.dataset.key) input.dataset.key = 'cs2';
            if (id === 'g2g-game2') input.dataset.key = 'val'; 
            
            input.value = games[input.dataset.key].name;
            setupCombobox(id);
        });
    }

    function setupCombobox(inputId) {
        const input = document.getElementById(inputId);
        const list = document.getElementById(inputId + '-list');

        function renderList(filter = '') {
            list.innerHTML = '';
            const f = filter.toLowerCase();
            for (let key in games) {
                const game = games[key];
                
                // Проверяем как само название, так и скрытые алиасы
                const matchName = game.name.toLowerCase().includes(f);
                const matchAlias = game.aliases && game.aliases.some(alias => alias.includes(f));
                
                if (matchName || matchAlias) {
                    const opt = document.createElement('div');
                    opt.className = 'combobox-option';
                    opt.innerText = game.name;
                    opt.onclick = () => {
                        input.value = game.name;
                        input.dataset.key = key;
                        list.classList.remove('active');
                        calculate();
                    };
                    list.appendChild(opt);
                }
            }
            if (list.innerHTML === '') {
                list.innerHTML = '<div class="combobox-option" style="color:#777">Not found</div>';
            }
        }

        input.addEventListener('focus', () => {
            input.select();
            renderList();
            list.classList.add('active');
        });

        input.addEventListener('input', () => {
            renderList(input.value);
            list.classList.add('active');
            
            // Если введено точное название игры
            let matchedKey = null;
            for (let key in games) {
                if (games[key].name.toLowerCase() === input.value.toLowerCase()) {
                    matchedKey = key;
                    break;
                }
            }
            if (matchedKey) {
                input.dataset.key = matchedKey;
            } else {
                input.dataset.key = ''; 
            }
            calculate();
        });

        document.addEventListener('click', (e) => {
            if (e.target !== input && !list.contains(e.target)) {
                list.classList.remove('active');
                if (input.dataset.key && games[input.dataset.key]) {
                    input.value = games[input.dataset.key].name;
                } else {
                    input.dataset.key = 'cs2';
                    input.value = games['cs2'].name;
                    calculate();
                }
            }
        });
    }

    function changeLang(lang) {
        currentLang = lang;
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
        
        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if(i18n[lang][key]) {
                elem.innerText = i18n[lang][key];
            }
        });

        document.getElementById('g2g-sens').placeholder = i18n[lang].placeholder_sens;
        document.getElementById('cm-dpi').placeholder = i18n[lang].placeholder_dpi;
        
        const dynInput = document.getElementById('cm-dynamic-input');
        dynInput.placeholder = isCmToGame ? i18n[lang].placeholder_cm : i18n[lang].placeholder_sens;

        calculate(); 
    }

    function switchMainTab(tab) {
        currentMainTab = tab;
        
        const slider = document.getElementById('tabs-slider');
        if (tab === 'cm') {
            slider.style.left = '4px';
        } else {
            slider.style.left = '50%';
        }

        document.getElementById('tab-cm').classList.toggle('active', tab === 'cm');
        document.getElementById('tab-g2g').classList.toggle('active', tab === 'g2g');
        
        document.getElementById('mode-cm').classList.toggle('hidden', tab !== 'cm');
        document.getElementById('mode-g2g').classList.toggle('hidden', tab !== 'g2g');
        calculate();
    }

    function setSubMode(isCm) {
        isCmToGame = isCm;
        
        const slider = document.getElementById('mini-slider');
        slider.style.left = isCm ? '3px' : '50%';
        
        document.getElementById('mtab-cm2game').classList.toggle('active', isCm);
        document.getElementById('mtab-game2cm').classList.toggle('active', !isCm);
        
        const dynInput = document.getElementById('cm-dynamic-input');
        dynInput.placeholder = isCm ? i18n[currentLang].placeholder_cm : i18n[currentLang].placeholder_sens;
        
        dynInput.value = '';
        calculate();
    }

    function calculate() {
        let resultText = "0.00";
        let resultLabel = i18n[currentLang].result_default;

        if (currentMainTab === 'g2g') {
            let g1 = document.getElementById('g2g-game1').dataset.key;
            let g2 = document.getElementById('g2g-game2').dataset.key;
            let sens = parseInputVal('g2g-sens'); 

            if (g1 && g2 && !isNaN(sens) && sens > 0) {
                let converted = (sens * games[g1].yaw) / games[g2].yaw;
                let dec = games[g2].decimals || 4; 
                resultText = converted.toFixed(dec); 
                resultLabel = `${i18n[currentLang].sens_for} ${games[g2].name}:`;
            }

        } else if (currentMainTab === 'cm') {
            let dpi = parseInputVal('cm-dpi');
            let val = parseInputVal('cm-dynamic-input');
            let g = document.getElementById('cm-game').dataset.key;
            
            if (g && !isNaN(dpi) && !isNaN(val) && val > 0 && dpi > 0) {
                if (isCmToGame) {
                    let sens = (360 * 2.54) / (val * dpi * games[g].yaw);
                    let dec = games[g].decimals || 4; 
                    resultText = sens.toFixed(dec);
                    resultLabel = `${i18n[currentLang].sens_for} ${games[g].name}:`;
                } else {
                    let cm = (360 * 2.54) / (val * dpi * games[g].yaw);
                    resultText = cm.toFixed(2) + " cm/360";
                    resultLabel = i18n[currentLang].cm_dist;
                }
            }
        }

        document.getElementById('result-value').innerText = resultText;
        document.getElementById('result-label').innerText = resultLabel;
    }
</script>

</html>
