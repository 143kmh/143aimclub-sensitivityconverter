<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>143 Aim Club - Sensitivity Converter</title>
    <style>
        /* БАЗОВЫЙ ДИЗАЙН И НОВЫЙ ШРИФТ */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 12vh;
            overflow-x: hidden;
            
            background-color: #05020a;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .calculator-card {
            background: rgba(15, 10, 25, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(96, 81, 155, 0.5);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(96, 81, 155, 0.3);
            position: relative;
            z-index: 1;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ С СОЦСЕТЯМИ И ЯЗЫКОМ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            font-size: 12px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn.active {
            color: #fff;
            text-shadow: 0 0 10px #60519b, 0 0 20px #60519b;
        }

        .social-links {
            display: flex;
            gap: 12px;
        }

        .social-links a {
            color: #888;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-links a:hover {
            color: #fff;
            filter: drop-shadow(0 0 8px #60519b);
            transform: translateY(-2px);
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .logo-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #60519b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 8px rgba(96, 81, 155, 0.6));
        }

        /* АНИМИРОВАННЫЙ ТУМБЛЕР */
        .tabs {
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(96, 81, 155, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* Ползунок */
        .tabs-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, rgba(96, 81, 155, 0.8), rgba(96, 81, 155, 0.2));
            border-radius: 8px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
            color: #888;
        }

        .tab.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* ПОЛЯ ВВОДА */
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(96, 81, 155, 0.3);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        select:focus, input:focus {
            border-color: #8a76df;
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .swap-btn {
            background: rgba(96, 81, 155, 0.15);
            border: 1px solid rgba(96, 81, 155, 0.4);
            color: #fff;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(96, 81, 155, 0.8);
            font-family: 'Space Grotesk', sans-serif;
        }

        .swap-btn:hover {
            background: rgba(96, 81, 155, 0.4);
            box-shadow: 0 0 15px rgba(96, 81, 155, 0.5);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px 15px;
            background: linear-gradient(180deg, rgba(96, 81, 155, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(96, 81, 155, 0.4);
            box-shadow: inset 0 0 20px rgba(96, 81, 155, 0.1);
        }

        .result-title {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-top: 5px;
            text-shadow: 0 0 15px #60519b, 0 0 30px #60519b;
        }

        .cs2-options {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(96, 81, 155, 0.3);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
        }

        .checkbox-container input {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #60519b;
        }

        .zoom-results {
            margin-top: 10px;
            font-size: 14px;
            color: #d8cfff;
            display: none;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(96, 81, 155, 0.2);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="calculator-card">
    
    <!-- НОВАЯ ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <!-- Языки -->
        <div class="lang-switch">
            <span class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</span>
            <span class="lang-btn" id="btn-ru" onclick="changeLang('ru')">RU</span>
        </div>
        <!-- Соцсети (вставь свои ссылки вместо #) -->
        <div class="social-links">
            <a href="#" target="_blank" title="YouTube">
                <svg viewBox="0 0 24 24"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.861-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>
            </a>
            <a href="#" target="_blank" title="Discord">
                <svg viewBox="0 0 24 24"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.03.03.03.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.02.02.05.03.08.02c1.71-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12z"/></svg>
            </a>
        </div>
    </div>

    <div class="logo-title">143 Aim Club</div>

    <div class="tabs">
        <!-- Тот самый ползунок -->
        <div class="tabs-slider" id="tabs-slider"></div>
        <div class="tab active" onclick="switchMainTab('g2g')" id="tab-g2g">Game to Game</div>
        <div class="tab" onclick="switchMainTab('cm')" id="tab-cm" data-i18n="tab_cm">cm/360 ↔ Game</div>
    </div>

    <div id="mode-g2g">
        <div class="input-group">
            <label data-i18n="from_game">From Game:</label>
            <select id="g2g-game1" onchange="calculate()"></select>
        </div>
        <div class="input-group">
            <label data-i18n="sens_label">Sensitivity:</label>
            <input type="number" id="g2g-sens" step="any" placeholder="e.g. 1.5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label data-i18n="to_game">To Game:</label>
            <select id="g2g-game2" onchange="calculate()"></select>
        </div>
    </div>

    <div id="mode-cm" class="hidden">
        <button class="swap-btn" onclick="toggleCmMode()" data-i18n="swap_btn">🔁 Swap Direction</button>
        
        <div class="input-group">
            <label data-i18n="mouse_dpi">Mouse DPI:</label>
            <input type="number" id="cm-dpi" step="any" placeholder="e.g. 800" value="800" oninput="calculate()">
        </div>

        <div id="cm-submode-cm2game">
            <div class="input-group">
                <label data-i18n="target_cm">Target cm/360:</label>
                <input type="number" id="cm-input-cm" step="any" placeholder="e.g. 35" oninput="calculate()">
            </div>
            <div class="input-group">
                <label data-i18n="game_label">Game:</label>
                <select id="cm-game1" onchange="calculate()"></select>
            </div>
        </div>

        <div id="cm-submode-game2cm" class="hidden">
            <div class="input-group">
                <label data-i18n="game_label_2">Game:</label>
                <select id="cm-game2" onchange="calculate()"></select>
            </div>
            <div class="input-group">
                <label data-i18n="ingame_sens">In-game Sensitivity:</label>
                <input type="number" id="cm-input-sens" step="any" placeholder="e.g. 1.5" oninput="calculate()">
            </div>
        </div>
    </div>

    <div class="result-box">
        <div class="result-title" id="result-label" data-i18n="result_default">RESULT:</div>
        <div class="result-value" id="result-value">0.00</div>
    </div>

    <div class="cs2-options" id="cs2-box">
        <label class="checkbox-container">
            <input type="checkbox" id="cs2-zoom-check" onchange="calculate()"> 
            <span data-i18n="cs2_zoom">Include Zoom (AWP/Scout)</span>
        </label>
        <div class="zoom-results" id="cs2-zoom-results">
            <span data-i18n="zoom1">1st Zoom:</span> <span id="cs2-z1">0</span> cm/360<br>
            <span data-i18n="zoom2">2nd Zoom:</span> <span id="cs2-z2">0</span> cm/360
        </div>
    </div>

</div>

<script>
    // ТВОИ ПАДАЮЩИЕ ЧАСТИЦЫ
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles =[];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.speedY = Math.random() * 4 + 2; 
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.7 + 0.3;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.y > canvas.height) {
                this.y = 0 - this.speedY;
                this.x = Math.random() * canvas.width;
            }
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
        }
        draw() {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.speedX * 3, this.y - this.speedY * 3); 
            ctx.strokeStyle = `rgba(138, 118, 223, ${this.alpha})`; 
            ctx.lineWidth = this.size;
            ctx.lineCap = 'round';
            ctx.stroke();
        }
    }

    for (let i = 0; i < 120; i++) {
        particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(5, 2, 10, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ЛОГИКА КАЛЬКУЛЯТОРА
    const games = {
        "cs2": { name: "Counter-Strike 2", yaw: 0.022 },
        "val": { name: "Valorant", yaw: 0.07 },
        "ow2": { name: "Overwatch 2", yaw: 0.0066 }
    };

    let currentMainTab = 'g2g'; 
    let isCmToGame = true; 
    let currentLang = 'en';

    const i18n = {
        en: {
            tab_g2g: "Game to Game",
            tab_cm: "cm/360 ↔ Game",
            from_game: "From Game:",
            sens_label: "Sensitivity:",
            to_game: "To Game:",
            swap_btn: "🔁 Swap Direction",
            mouse_dpi: "Mouse DPI:",
            target_cm: "Target cm/360:",
            game_label: "Game:",
            game_label_2: "Game:",
            ingame_sens: "In-game Sensitivity:",
            result_default: "RESULT:",
            sens_for: "Sensitivity for",
            cm_dist: "Distance on mousepad:",
            cs2_zoom: "Include Zoom (AWP/Scout)",
            zoom1: "1st Zoom:",
            zoom2: "2nd Zoom:",
            placeholder_sens: "e.g. 1.5",
            placeholder_dpi: "e.g. 800",
            placeholder_cm: "e.g. 35"
        },
        ru: {
            tab_g2g: "Игра к Игре",
            tab_cm: "cm/360 ↔ Игра",
            from_game: "Из игры:",
            sens_label: "Чувствительность:",
            to_game: "В игру:",
            swap_btn: "🔁 Сменить направление",
            mouse_dpi: "DPI мыши:",
            target_cm: "Желаемые cm/360:",
            game_label: "Игра:",
            game_label_2: "Игра:",
            ingame_sens: "Сенса в игре:",
            result_default: "РЕЗУЛЬТАТ:",
            sens_for: "Сенса для",
            cm_dist: "Дистанция на коврике:",
            cs2_zoom: "Учитывать Зум (AWP/Scout)",
            zoom1: "1-й Зум:",
            zoom2: "2-й Зум:",
            placeholder_sens: "Например: 1.5",
            placeholder_dpi: "Например: 800",
            placeholder_cm: "Например: 35"
        }
    };

    window.onload = () => {
        populateSelects();
        changeLang('en'); 
    };

    function changeLang(lang) {
        currentLang = lang;
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
        
        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if(i18n[lang][key]) {
                elem.innerText = i18n[lang][key];
            }
        });

        document.getElementById('tab-g2g').innerText = i18n[lang].tab_g2g;
        document.getElementById('g2g-sens').placeholder = i18n[lang].placeholder_sens;
        document.getElementById('cm-input-sens').placeholder = i18n[lang].placeholder_sens;
        document.getElementById('cm-dpi').placeholder = i18n[lang].placeholder_dpi;
        document.getElementById('cm-input-cm').placeholder = i18n[lang].placeholder_cm;

        calculate(); 
    }

    function populateSelects() {
        const selects =['g2g-game1', 'g2g-game2', 'cm-game1', 'cm-game2'];
        let optionsHTML = '';
        for (let key in games) {
            optionsHTML += `<option value="${key}">${games[key].name}</option>`;
        }
        selects.forEach(id => {
            document.getElementById(id).innerHTML = optionsHTML;
        });
        document.getElementById('g2g-game2').value = 'val'; 
    }

    function switchMainTab(tab) {
        currentMainTab = tab;
        
        // Логика переезда ползунка
        const slider = document.getElementById('tabs-slider');
        if (tab === 'g2g') {
            slider.style.transform = 'translateX(0)';
        } else {
            slider.style.transform = 'translateX(100%)';
        }

        document.getElementById('tab-g2g').classList.toggle('active', tab === 'g2g');
        document.getElementById('tab-cm').classList.toggle('active', tab === 'cm');
        
        document.getElementById('mode-g2g').classList.toggle('hidden', tab !== 'g2g');
        document.getElementById('mode-cm').classList.toggle('hidden', tab !== 'cm');
        calculate();
    }

    function toggleCmMode() {
        isCmToGame = !isCmToGame;
        document.getElementById('cm-submode-cm2game').classList.toggle('hidden', !isCmToGame);
        document.getElementById('cm-submode-game2cm').classList.toggle('hidden', isCmToGame);
        calculate();
    }

    function calculate() {
        let resultText = "0.00";
        let resultLabel = i18n[currentLang].result_default;
        let showCs2Box = false;
        let baseCm360 = 0; 

        if (currentMainTab === 'g2g') {
            let g1 = document.getElementById('g2g-game1').value;
            let g2 = document.getElementById('g2g-game2').value;
            let sens = parseFloat(document.getElementById('g2g-sens').value);

            if (!isNaN(sens) && sens > 0) {
                let converted = (sens * games[g1].yaw) / games[g2].yaw;
                resultText = converted.toFixed(4); 
                resultLabel = `${i18n[currentLang].sens_for} ${games[g2].name}:`;
            }
            if (g1 === 'cs2' || g2 === 'cs2') showCs2Box = true;
            
            if (!isNaN(sens) && sens > 0) {
                baseCm360 = (360 * 2.54) / (sens * 800 * games[g1].yaw); 
            }

        } else if (currentMainTab === 'cm') {
            let dpi = parseFloat(document.getElementById('cm-dpi').value);

            if (isCmToGame) {
                let cm = parseFloat(document.getElementById('cm-input-cm').value);
                let g = document.getElementById('cm-game1').value;
                if (!isNaN(dpi) && !isNaN(cm) && cm > 0 && dpi > 0) {
                    let sens = (360 * 2.54) / (cm * dpi * games[g].yaw);
                    resultText = sens.toFixed(4);
                    resultLabel = `${i18n[currentLang].sens_for} ${games[g].name}:`;
                    baseCm360 = cm;
                }
                if (g === 'cs2') showCs2Box = true;
            } else {
                let sens = parseFloat(document.getElementById('cm-input-sens').value);
                let g = document.getElementById('cm-game2').value;
                if (!isNaN(dpi) && !isNaN(sens) && sens > 0 && dpi > 0) {
                    let cm = (360 * 2.54) / (sens * dpi * games[g].yaw);
                    resultText = cm.toFixed(2) + " cm/360";
                    resultLabel = i18n[currentLang].cm_dist;
                    baseCm360 = cm;
                }
                if (g === 'cs2') showCs2Box = true;
            }
        }

        document.getElementById('result-value').innerText = resultText;
        document.getElementById('result-label').innerText = resultLabel;

        const cs2Box = document.getElementById('cs2-box');
        const zoomResults = document.getElementById('cs2-zoom-results');
        const isChecked = document.getElementById('cs2-zoom-check').checked;

        if (showCs2Box) {
            cs2Box.style.display = 'block';
            if (isChecked && baseCm360 > 0) {
                zoomResults.style.display = 'block';
                document.getElementById('cs2-z1').innerText = (baseCm360 * 2.25).toFixed(1);
                document.getElementById('cs2-z2').innerText = (baseCm360 * 6.0).toFixed(1);
            } else {
                zoomResults.style.display = 'none';
            }
        } else {
            cs2Box.style.display = 'none';
            document.getElementById('cs2-zoom-check').checked = false;
            zoomResults.style.display = 'none';
        }
    }
</script>

</body>
</html>
