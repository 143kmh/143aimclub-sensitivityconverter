</div>

<script>
    // === ОБНОВЛЕННАЯ АНИМАЦИЯ ЧАСТИЦ ===
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles =[];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            // Увеличиваем скорость и задаем падение строго вниз с микро-сдвигом
            this.speedY = Math.random() * 4 + 2; 
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 1.5 + 0.5; // Толщина линии
            this.alpha = Math.random() * 0.7 + 0.3; // Стали ярче
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            
            // Если частица упала за край экрана, возвращаем её наверх
            if (this.y > canvas.height) {
                this.y = 0 - this.speedY; // Спавним чуть выше края
                this.x = Math.random() * canvas.width;
            }
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
        }
        draw() {
            // Рисуем линии со шлейфом вместо точек для максимальной резкости
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            // Длина хвоста зависит от скорости
            ctx.lineTo(this.x - this.speedX * 3, this.y - this.speedY * 3); 
            ctx.strokeStyle = `rgba(138, 118, 223, ${this.alpha})`; 
            ctx.lineWidth = this.size;
            ctx.lineCap = 'round';
            ctx.stroke();
        }
    }

    // 120 частиц для идеального баланса
    for (let i = 0; i < 120; i++) {
        particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Темная пелена поверх твоей картинки (чтобы текст читался)
        ctx.fillStyle = "rgba(5, 2, 10, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();
